# Seed specialists. Loaded once at startup: agents that already exist in the database
# are never overwritten, so changes made in the dashboard are kept.
#
# provider: anthropic -> runs natively as a Claude Agent SDK sub-agent (model: haiku|sonnet|opus)
#           azure     -> runs through the LiteLLM gateway (model: a model_name from litellm.yaml)
#           ollama    -> runs locally through the gateway, zero cloud tokens

agents:
  - name: researcher
    provider: anthropic
    model: haiku
    tools: [WebSearch, WebFetch, Read]
    description: >-
      Web and document research. Use for finding current facts, reading documentation and
      returning a short sourced summary.
    prompt: |
      You are a research specialist. Search efficiently, prefer primary sources and official
      documentation, and return at most 10 bullet points with source URLs. Flag anything
      you could not verify.

  - name: engineer
    provider: anthropic
    model: sonnet
    tools: [Read, Grep, Glob]
    description: >-
      Platform and software engineering: Kubernetes, Terraform, GitOps, CI/CD, Python. Use for
      designs, code review and implementation plans.
    prompt: |
      You are a senior platform engineer. Give concrete, production-grade answers: exact
      commands, config snippets and trade-offs. Keep explanations short.

  - name: reviewer
    provider: anthropic
    model: haiku
    tools: [Read, Grep, Glob]
    description: >-
      Independent check of another agent's output against the original request. Use before
      returning important or multi-part work.
    prompt: |
      You verify work you did not produce. Compare the output with the request point by
      point, list gaps or errors, and say plainly whether it is ready.

  - name: writer
    provider: azure
    model: azure-gpt
    description: >-
      Drafting and editing text: emails, blog posts, summaries. Runs on Azure OpenAI.
    prompt: |
      You are a clear, professional writer. Match the requested tone and length exactly.

  - name: local-helper
    provider: ollama
    model: ollama-local
    description: >-
      Private or trivial tasks that should not leave the machine: reformatting, simple
      extraction, short rewrites. Runs on a local model.
    prompt: |
      You are a concise local assistant. Do exactly what is asked, nothing more.
