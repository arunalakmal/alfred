[project]
name = "alfred"
version = "0.1.0"
description = "Alfred: a personal multi-agent assistant (manager + specialist sub-agents, multi-provider, usage dashboard)"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.127",   # >= 0.2.127 for subagent depth/concurrency/budget caps
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alfred = "alfred.cli:main"
alfred-server = "alfred.api:main"
alfred-mcp = "alfred.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alfred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
